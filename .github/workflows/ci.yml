name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: musicroom
          POSTGRES_PASSWORD: musicroom
          POSTGRES_DB: musicroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://musicroom:musicroom@localhost:5432/musicroom
      NODE_ENV: test
      LOG_LEVEL: silent
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No .env file is tracked
        run: test -z "$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$')"
      - name: No secret in the history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # What ships in the API image; the Expo toolchain is audited by hand (see docs/SECURITY.md).
      - run: npm audit --omit=dev -w @music-room/api -w @music-room/shared --audit-level=high
      - run: npm run build -w @music-room/shared
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run lint
      - run: npm run typecheck --workspaces --if-present
      # The api tests create, migrate and empty their own database (musicroom_test).
      - run: npm test --workspaces --if-present
