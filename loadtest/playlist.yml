# Playlist Editor: every user sits in the room of one playlist and adds, moves and removes
# an entry. 409 answers are expected: they are edits that lost a race.
scenarios:
  - name: playlist
    engine: socketio
    socketio:
      transports: [websocket]
      auth: { token: '{{ token }}', platform: android, device: loadtest, appVersion: 1.0.0 }
    flow:
      - function: setIds
      - emit:
          channel: room:join
          data: { kind: playlist, id: '{{ playlistId }}' }
          acknowledge: { match: { json: '$.ok', value: true } }
      - get:
          url: /api/v1/playlists/{{ playlistId }}/entries
          headers: { Authorization: 'Bearer {{ token }}' }
      - loop:
          - function: pickStep
          - post:
              url: /api/v1/playlists/{{ playlistId }}/entries
              headers: { Authorization: 'Bearer {{ token }}' }
              json: { deezerId: '{{ trackId }}' }
              capture:
                - json: '$.entries[-1:].id'
                  as: added
          - think: 2
          - patch:
              url: /api/v1/playlists/{{ playlistId }}/entries/{{ added }}
              headers: { Authorization: 'Bearer {{ token }}' }
              json: { afterEntryId: null }
          - think: 2
          - delete:
              url: /api/v1/playlists/{{ playlistId }}/entries/{{ added }}
              headers: { Authorization: 'Bearer {{ token }}' }
          - think: 2
        count: 5
